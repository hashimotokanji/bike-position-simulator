<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>バイクジオメトリ＆ポジション シミュレーター</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: #1e293b;
            --accent-color: #38bdf8;
            --accent-bike: #f43f5e;
            --accent-pos: #10b981;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --border-color: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            touch-action: manipulation;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        header {
            background-color: var(--panel-bg);
            padding: 12px 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--accent-color);
        }

        .main-container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        .sidebar {
            width: 360px;
            background-color: var(--panel-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            z-index: 10;
        }

        .calc-results {
            padding: 16px;
            background-color: rgba(56, 189, 248, 0.05);
            border-bottom: 1px solid var(--border-color);
        }

        .result-card {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .result-item {
            background-color: rgba(15, 23, 42, 0.6);
            padding: 10px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
        }

        .result-item label {
            font-size: 0.75rem;
            color: var(--text-sub);
            display: block;
            margin-bottom: 4px;
        }

        .result-item .value {
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--accent-color);
        }

        .inputs-container {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            -webkit-overflow-scrolling: touch;
        }

        .section-title {
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin: 16px 0 10px 0;
            padding-bottom: 4px;
            border-bottom: 2px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section-title.geo { color: var(--accent-bike); border-color: var(--accent-bike); }
        .section-title.pos { color: var(--accent-pos); border-color: var(--accent-pos); }
        .section-title:first-child { margin-top: 0; }

        .input-group {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .input-group label {
            font-size: 0.85rem;
            color: var(--text-main);
        }

        .input-wrapper {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .input-group input {
            width: 80px;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 6px 8px;
            border-radius: 4px;
            font-size: 0.9rem;
            text-align: right;
        }

        .input-group input:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        .input-group span.unit {
            font-size: 0.75rem;
            color: var(--text-sub);
            width: 24px;
        }

        .viewport {
            flex: 1;
            position: relative;
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            touch-action: none;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .controls-hint {
            position: absolute;
            bottom: 12px;
            right: 12px;
            background: rgba(30, 41, 59, 0.8);
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 0.75rem;
            color: var(--text-sub);
            pointer-events: none;
            border: 1px solid var(--border-color);
        }

        @media (max-width: 768px) {
            .main-container {
                flex-direction: column-reverse;
            }
            .sidebar {
                width: 100%;
                height: 50%;
            }
            .viewport {
                height: 50%;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>バイクジオメトリ＆ポジション シミュレーター</h1>
    </header>

    <div class="main-container">
        <div class="sidebar">
            <div class="calc-results">
                <div class="result-card">
                    <div class="result-item">
                        <label>サドルトップ 〜 ハンドルクランプ長</label>
                        <div class="value" id="res-saddle-to-clamp">- mm</div>
                    </div>
                    <div class="result-item">
                        <label>BBセンター 〜 ハンドルトップ高</label>
                        <div class="value" id="res-bb-to-handletop">- mm</div>
                    </div>
                </div>
            </div>

            <div class="inputs-container">
                <div class="section-title geo">バイクジオメトリ</div>
                <div class="input-group">
                    <label for="reach">リーチ</label>
                    <div class="input-wrapper"><input type="number" id="reach" value="385"><span class="unit">mm</span></div>
                </div>
                <div class="input-group">
                    <label for="stack">スタック</label>
                    <div class="input-wrapper"><input type="number" id="stack" value="540"><span class="unit">mm</span></div>
                </div>
                <div class="input-group">
                    <label for="headAngle">ヘッドアングル</label>
                    <div class="input-wrapper"><input type="number" id="headAngle" value="73" step="0.1"><span class="unit">°</span></div>
                </div>
                <div class="input-group">
                    <label for="seatAngle">シートアングル</label>
                    <div class="input-wrapper"><input type="number" id="seatAngle" value="74" step="0.1"><span class="unit">°</span></div>
                </div>
                <div class="input-group">
                    <label for="seatTube">シートチューブ長</label>
                    <div class="input-wrapper"><input type="number" id="seatTube" value="500"><span class="unit">mm</span></div>
                </div>
                <div class="input-group">
                    <label for="ett">仮想トップチューブ長(水平)</label>
                    <div class="input-wrapper"><input type="number" id="ett" value="535"><span class="unit">mm</span></div>
                </div>
                <div class="input-group">
                    <label for="rearCenter">リアセンター長</label>
                    <div class="input-wrapper"><input type="number" id="rearCenter" value="410"><span class="unit">mm</span></div>
                </div>
                <div class="input-group">
                    <label for="frontCenter">フロントセンター長</label>
                    <div class="input-wrapper"><input type="number" id="frontCenter" value="580"><span class="unit">mm</span></div>
                </div>
                <div class="input-group">
                    <label for="bbDrop">BB下がり</label>
                    <div class="input-wrapper"><input type="number" id="bbDrop" value="70"><span class="unit">mm</span></div>
                </div>
                <div class="input-group">
                    <label for="forkOffset">フォークオフセット</label>
                    <div class="input-wrapper"><input type="number" id="forkOffset" value="45"><span class="unit">mm</span></div>
                </div>
                <div class="input-group">
                    <label for="wheelbase">ホイールベース</label>
                    <div class="input-wrapper"><input type="number" id="wheelbase" value="980"><span class="unit">mm</span></div>
                </div>
                <div class="input-group">
                    <label for="headTube">ヘッドチューブ長</label>
                    <div class="input-wrapper"><input type="number" id="headTube" value="130"><span class="unit">mm</span></div>
                </div>

                <div class="section-title pos">ポジション設定</div>
                <div class="input-group">
                    <label for="stemLength">ステム長</label>
                    <div class="input-wrapper"><input type="number" id="stemLength" value="100"><span class="unit">mm</span></div>
                </div>
                <div class="input-group">
                    <label for="stemAngle">ステムアングル</label>
                    <div class="input-wrapper"><input type="number" id="stemAngle" value="-6" step="0.1"><span class="unit">°</span></div>
                </div>
                <div class="input-group">
                    <label for="stemStack">ステムスタックハイト</label>
                    <div class="input-wrapper"><input type="number" id="stemStack" value="40"><span class="unit">mm</span></div>
                </div>
                <div class="input-group">
                    <label for="spacerHeight">ステムスペーサー高さ</label>
                    <div class="input-wrapper"><input type="number" id="spacerHeight" value="15"><span class="unit">mm</span></div>
                </div>
                <div class="input-group">
                    <label for="handleReach">ハンドルリーチ</label>
                    <div class="input-wrapper"><input type="number" id="handleReach" value="80"><span class="unit">mm</span></div>
                </div>
                <div class="input-group">
                    <label for="handleDrop">ハンドルドロップ</label>
                    <div class="input-wrapper"><input type="number" id="handleDrop" value="125"><span class="unit">mm</span></div>
                </div>
                <div class="input-group">
                    <label for="saddleHeight">サドル高 (BB〜サドルトップ直線長)</label>
                    <div class="input-wrapper"><input type="number" id="saddleHeight" value="700"><span class="unit">mm</span></div>
                </div>
            </div>
        </div>

        <div class="viewport" id="viewport">
            <canvas id="bikeCanvas"></canvas>
            <div class="controls-hint">ドラッグ/スワイプ: 移動 | ピンチ/ホイール: 拡大縮小</div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('bikeCanvas');
        const ctx = canvas.getContext('2d');
        const viewport = document.getElementById('viewport');

        let scale = 0.8;
        let panX = 0;
        let panY = 0;
        let isDragging = false;
        let startX, startY;
        let initialPinchDistance = null;

        const inputs = [
            'reach', 'stack', 'headAngle', 'seatAngle', 'seatTube', 'ett',
            'rearCenter', 'frontCenter', 'bbDrop', 'forkOffset', 'wheelbase', 'headTube',
            'stemLength', 'stemAngle', 'stemStack', 'spacerHeight',
            'handleReach', 'handleDrop', 'saddleHeight'
        ].reduce((acc, id) => {
            acc[id] = document.getElementById(id);
            return acc;
        }, {});

        function resizeCanvas() {
            canvas.width = viewport.clientWidth;
            canvas.height = viewport.clientHeight;
            if (panX === 0 && panY === 0) {
                panX = canvas.width / 2 - 100;
                panY = canvas.height / 2 + 150;
            }
            draw();
        }

        window.addEventListener('resize', resizeCanvas);

        Object.values(inputs).forEach(input => {
            input.addEventListener('input', draw);
        });

        // --- マウス操作 ---
        viewport.addEventListener('mousedown', (e) => {
            isDragging = true;
            startX = e.clientX - panX;
            startY = e.clientY - panY;
        });

        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            panX = e.clientX - startX;
            panY = e.clientY - startY;
            draw();
        });

        window.addEventListener('mouseup', () => isDragging = false);

        viewport.addEventListener('wheel', (e) => {
            e.preventDefault();
            const zoomFactor = 1.05;
            if (e.deltaY < 0) {
                scale *= zoomFactor;
            } else {
                scale /= zoomFactor;
            }
            draw();
        }, { passive: false });

        // --- タッチ操作 (ピンチズーム & パン) ---
        function getTouchDistance(touches) {
            return Math.hypot(
                touches[0].clientX - touches[1].clientX,
                touches[0].clientY - touches[1].clientY
            );
        }

        viewport.addEventListener('touchstart', (e) => {
            if (e.touches.length === 1) {
                isDragging = true;
                startX = e.touches[0].clientX - panX;
                startY = e.touches[0].clientY - panY;
            } else if (e.touches.length === 2) {
                isDragging = false;
                initialPinchDistance = getTouchDistance(e.touches);
            }
        }, { passive: true });

        viewport.addEventListener('touchmove', (e) => {
            if (e.touches.length === 1 && isDragging) {
                panX = e.touches[0].clientX - startX;
                panY = e.touches[0].clientY - startY;
                draw();
            } else if (e.touches.length === 2 && initialPinchDistance) {
                const currentDistance = getTouchDistance(e.touches);
                const factor = currentDistance / initialPinchDistance;
                scale *= factor;
                initialPinchDistance = currentDistance;
                draw();
            }
        }, { passive: true });

        viewport.addEventListener('touchend', (e) => {
            if (e.touches.length < 2) {
                initialPinchDistance = null;
            }
            if (e.touches.length === 0) {
                isDragging = false;
            }
        });

        const degToRad = deg => (deg * Math.PI) / 180;

        function draw() {
            const val = id => parseFloat(inputs[id].value) || 0;

            const reach = val('reach');
            const stack = val('stack');
            const headAngle = val('headAngle');
            const seatAngle = val('seatAngle');
            const seatTube = val('seatTube');
            const ett = val('ett');
            const rearCenter = val('rearCenter');
            const frontCenter = val('frontCenter');
            const bbDrop = val('bbDrop');
            const forkOffset = val('forkOffset');
            const wheelbase = val('wheelbase');
            const headTube = val('headTube');

            const stemLength = val('stemLength');
            const stemAngle = val('stemAngle');
            const stemStack = val('stemStack');
            const spacerHeight = val('spacerHeight');
            const handleReach = val('handleReach');
            const handleDrop = val('handleDrop');
            const saddleHeight = val('saddleHeight');

            // --- 幾何学計算 (BBセンター原点 (0,0)) ---
            // 角度基準：車体後方からの水平線（地平線）基準で立ち上がる
            // ラジアン計算 (角度θ → X方向: -cosθ, Y方向: +sinθ)
            const stRad = degToRad(seatAngle);
            const htRad = degToRad(headAngle);

            // 1. サドルトップ位置 (写真2の赤線: BBから直接直線距離で伸ばす)
            const saddleTop = {
                x: -saddleHeight * Math.cos(stRad),
                y: saddleHeight * Math.sin(stRad)
            };

            // 2. ヘッドチューブ上部センター (リーチ/スタック点)
            const htTopCenter = { x: reach, y: stack };

            // 3. ステム＆ハンドル位置
            // コラムの伸ばす方向 (ヘッドチューブに沿って上方向)
            const steererDist = spacerHeight + (stemStack / 2);
            const steererPoint = {
                x: htTopCenter.x - steererDist * Math.cos(htRad),
                y: htTopCenter.y + steererDist * Math.sin(htRad)
            };

            // ステムの角度 (コラムに垂直な面からの傾き)
            const totalStemRad = htRad - degToRad(90) + degToRad(stemAngle);
            const clampCenter = {
                x: steererPoint.x + stemLength * Math.cos(totalStemRad),
                y: steererPoint.y + stemLength * Math.sin(totalStemRad)
            };

            const barTop = {
                x: clampCenter.x,
                y: clampCenter.y + 15
            };

            // --- 必須計算出力 ---
            const saddleToClamp = Math.sqrt(
                Math.pow(clampCenter.x - saddleTop.x, 2) + 
                Math.pow(clampCenter.y - saddleTop.y, 2)
            );
            const bbToHandleTop = barTop.y;

            document.getElementById('res-saddle-to-clamp').innerText = `${saddleToClamp.toFixed(1)} mm`;
            document.getElementById('res-bb-to-handletop').innerText = `${bbToHandleTop.toFixed(1)} mm`;

            // --- Canvas描画 ---
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const toPx = (pt) => ({
                x: panX + pt.x * scale,
                y: panY - pt.y * scale
            });

            // 背景グリッド
            ctx.strokeStyle = '#1e293b';
            ctx.lineWidth = 1;
            const gridSize = 100 * scale;
            for (let x = panX % gridSize; x < canvas.width; x += gridSize) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
            }
            for (let y = panY % gridSize; y < canvas.height; y += gridSize) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
            }

            const rearAxle = { x: -rearCenter, y: -bbDrop };
            const frontAxle = { x: frontCenter, y: -bbDrop };
            
            // ヘッドチューブ下部
            const htBottomCenter = {
                x: htTopCenter.x + headTube * Math.cos(htRad),
                y: htTopCenter.y - headTube * Math.sin(htRad)
            };

            // シートチューブ上部
            const seatTubeTop = {
                x: -seatTube * Math.cos(stRad),
                y: seatTube * Math.sin(stRad)
            };

            const drawLine = (pt1, pt2, color, width = 2, dash = []) => {
                const p1 = toPx(pt1), p2 = toPx(pt2);
                ctx.save();
                ctx.beginPath();
                ctx.setLineDash(dash);
                ctx.moveTo(p1.x, p1.y);
                ctx.lineTo(p2.x, p2.y);
                ctx.strokeStyle = color;
                ctx.lineWidth = width;
                ctx.stroke();
                ctx.restore();
            };

            const drawCircle = (pt, radius, color, isFill = false) => {
                const p = toPx(pt);
                ctx.beginPath();
                ctx.arc(p.x, p.y, radius * scale, 0, Math.PI * 2);
                if (isFill) {
                    ctx.fillStyle = color;
                    ctx.fill();
                } else {
                    ctx.strokeStyle = color;
                    ctx.lineWidth = 2;
                    ctx.stroke();
                }
            };

            // 1. ホイール
            drawCircle(rearAxle, 340, '#334155');
            drawCircle(frontAxle, 340, '#334155');

            // 2. フレーム
            drawLine({x:0, y:0}, rearAxle, '#f43f5e', 3);
            drawLine(rearAxle, seatTubeTop, '#f43f5e', 2);
            drawLine({x:0, y:0}, seatTubeTop, '#f43f5e', 3);
            drawLine({x:0, y:0}, htBottomCenter, '#f43f5e', 3);
            drawLine(seatTubeTop, htTopCenter, '#f43f5e', 3);
            drawLine(htBottomCenter, htTopCenter, '#f43f5e', 4);
            drawLine(htBottomCenter, frontAxle, '#f43f5e', 2.5);

            // 3. ポジションパーツ
            // シートポスト (写真2の赤線部分: BBから直線的にサドルまで接続)
            drawLine({x:0, y:0}, saddleTop, '#10b981', 3);
            
            // サドル本体
            const saddleLeft = { x: saddleTop.x - 130, y: saddleTop.y };
            const saddleRight = { x: saddleTop.x + 140, y: saddleTop.y };
            drawLine(saddleLeft, saddleRight, '#10b981', 5);

            // ステム & ハンドル
            drawLine(htTopCenter, steererPoint, '#10b981', 4);
            drawLine(steererPoint, clampCenter, '#10b981', 5);

            const handleHood = { x: clampCenter.x + handleReach, y: clampCenter.y };
            const handleDropPt = { x: clampCenter.x + handleReach - 20, y: clampCenter.y - handleDrop };
            drawLine(clampCenter, handleHood, '#10b981', 3);
            drawLine(handleHood, handleDropPt, '#10b981', 2);

            // 4. 計算・アングル参照用ガイド
            drawLine(saddleTop, clampCenter, '#38bdf8', 1.5, [4, 4]);
            drawLine({x: 0, y: 0}, {x: barTop.x, y: 0}, '#64748b', 1, [2, 2]);
            drawLine({x: barTop.x, y: 0}, barTop, '#38bdf8', 1.5, [4, 4]);

            // 5. マーク
            drawCircle({x:0, y:0}, 8, '#f8fafc', true);
            drawCircle(clampCenter, 5, '#38bdf8', true);
            drawCircle(saddleTop, 5, '#10b981', true);
        }

        resizeCanvas();
    </script>
</body>
</html>
