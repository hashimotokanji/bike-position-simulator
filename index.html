<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>バイクジオメトリ＆ポジション シミュレーター</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: #1e293b;
            --accent-color: #38bdf8;
            --accent-bike: #f43f5e;
            --accent-pos: #10b981;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --border-color: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        header {
            background-color: var(--panel-bg);
            padding: 12px 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--accent-color);
        }

        .main-container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* Sidebar Navigation & Panels */
        .sidebar {
            width: 360px;
            background-color: var(--panel-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            z-index: 10;
        }

        .calc-results {
            padding: 16px;
            background-color: rgba(56, 189, 248, 0.05);
            border-bottom: 1px solid var(--border-color);
        }

        .result-card {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .result-item {
            background-color: rgba(15, 23, 42, 0.6);
            padding: 10px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
        }

        .result-item label {
            font-size: 0.75rem;
            color: var(--text-sub);
            display: block;
            margin-bottom: 4px;
        }

        .result-item .value {
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--accent-color);
        }

        .inputs-container {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
        }

        .section-title {
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin: 16px 0 10px 0;
            padding-bottom: 4px;
            border-bottom: 2px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section-title.geo { color: var(--accent-bike); border-color: var(--accent-bike); }
        .section-title.pos { color: var(--accent-pos); border-color: var(--accent-pos); }
        .section-title:first-child { margin-top: 0; }

        .input-group {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .input-group label {
            font-size: 0.85rem;
            color: var(--text-main);
        }

        .input-wrapper {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .input-group input {
            width: 80px;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.85rem;
            text-align: right;
        }

        .input-group input:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        .input-group span.unit {
            font-size: 0.75rem;
            color: var(--text-sub);
            width: 24px;
        }

        /* Canvas Visualization Viewport */
        .viewport {
            flex: 1;
            position: relative;
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .controls-hint {
            position: absolute;
            bottom: 12px;
            right: 12px;
            background: rgba(30, 41, 59, 0.8);
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 0.75rem;
            color: var(--text-sub);
            pointer-events: none;
            border: 1px solid var(--border-color);
        }

        @media (max-width: 768px) {
            .main-container {
                flex-direction: column-reverse;
            }
            .sidebar {
                width: 100%;
                height: 50%;
            }
            .viewport {
                height: 50%;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>バイクジオメトリ＆ポジション シミュレーター</h1>
    </header>

    <div class="main-container">
        <!-- サイドバー：計算結果 ＆ 入力フォーム -->
        <div class="sidebar">
            <div class="calc-results">
                <div class="result-card">
                    <div class="result-item">
                        <label>サドルトップ 〜 ハンドルクランプ長</label>
                        <div class="value" id="res-saddle-to-clamp">- mm</div>
                    </div>
                    <div class="result-item">
                        <label>BBセンター 〜 ハンドルトップ高</label>
                        <div class="value" id="res-bb-to-handletop">- mm</div>
                    </div>
                </div>
            </div>

            <div class="inputs-container">
                <div class="section-title geo">バイクジオメトリ</div>
                <div class="input-group">
                    <label for="reach">リーチ</label>
                    <div class="input-wrapper"><input type="number" id="reach" value="385"><span class="unit">mm</span></div>
                </div>
                <div class="input-group">
                    <label for="stack">スタック</label>
                    <div class="input-wrapper"><input type="number" id="stack" value="540"><span class="unit">mm</span></div>
                </div>
                <div class="input-group">
                    <label for="headAngle">ヘッドアングル</label>
                    <div class="input-wrapper"><input type="number" id="headAngle" value="73" step="0.1"><span class="unit">°</span></div>
                </div>
                <div class="input-group">
                    <label for="seatAngle">シートアングル</label>
                    <div class="input-wrapper"><input type="number" id="seatAngle" value="74" step="0.1"><span class="unit">°</span></div>
                </div>
                <div class="input-group">
                    <label for="seatTube">シートチューブ長</label>
                    <div class="input-wrapper"><input type="number" id="seatTube" value="500"><span class="unit">mm</span></div>
                </div>
                <div class="input-group">
                    <label for="ett">仮想トップチューブ長(水平)</label>
                    <div class="input-wrapper"><input type="number" id="ett" value="535"><span class="unit">mm</span></div>
                </div>
                <div class="input-group">
                    <label for="rearCenter">リアセンター長</label>
                    <div class="input-wrapper"><input type="number" id="rearCenter" value="410"><span class="unit">mm</span></div>
                </div>
                <div class="input-group">
                    <label for="frontCenter">フロントセンター長</label>
                    <div class="input-wrapper"><input type="number" id="frontCenter" value="580"><span class="unit">mm</span></div>
                </div>
                <div class="input-group">
                    <label for="bbDrop">BB下がり</label>
                    <div class="input-wrapper"><input type="number" id="bbDrop" value="70"><span class="unit">mm</span></div>
                </div>
                <div class="input-group">
                    <label for="forkOffset">フォークオフセット</label>
                    <div class="input-wrapper"><input type="number" id="forkOffset" value="45"><span class="unit">mm</span></div>
                </div>
                <div class="input-group">
                    <label for="wheelbase">ホイールベース</label>
                    <div class="input-wrapper"><input type="number" id="wheelbase" value="980"><span class="unit">mm</span></div>
                </div>
                <div class="input-group">
                    <label for="headTube">ヘッドチューブ長</label>
                    <div class="input-wrapper"><input type="number" id="headTube" value="130"><span class="unit">mm</span></div>
                </div>

                <div class="section-title pos">ポジション設定</div>
                <div class="input-group">
                    <label for="stemLength">ステム長</label>
                    <div class="input-wrapper"><input type="number" id="stemLength" value="100"><span class="unit">mm</span></div>
                </div>
                <div class="input-group">
                    <label for="stemAngle">ステムアングル</label>
                    <div class="input-wrapper"><input type="number" id="stemAngle" value="-6" step="0.1"><span class="unit">°</span></div>
                </div>
                <div class="input-group">
                    <label for="stemStack">ステムスタックハイト</label>
                    <div class="input-wrapper"><input type="number" id="stemStack" value="40"><span class="unit">mm</span></div>
                </div>
                <div class="input-group">
                    <label for="spacerHeight">ステムスペーサー高さ</label>
                    <div class="input-wrapper"><input type="number" id="spacerHeight" value="15"><span class="unit">mm</span></div>
                </div>
                <div class="input-group">
                    <label for="handleReach">ハンドルリーチ</label>
                    <div class="input-wrapper"><input type="number" id="handleReach" value="80"><span class="unit">mm</span></div>
                </div>
                <div class="input-group">
                    <label for="handleDrop">ハンドルドロップ</label>
                    <div class="input-wrapper"><input type="number" id="handleDrop" value="125"><span class="unit">mm</span></div>
                </div>
                <div class="input-group">
                    <label for="saddleHeight">サドル高 (BB〜サドルトップ)</label>
                    <div class="input-wrapper"><input type="number" id="saddleHeight" value="700"><span class="unit">mm</span></div>
                </div>
                <div class="input-group">
                    <label for="saddleSetback">サドルセットバック(後退量)</label>
                    <div class="input-wrapper"><input type="number" id="saddleSetback" value="50"><span class="unit">mm</span></div>
                </div>
            </div>
        </div>

        <!-- メイン描画エリア -->
        <div class="viewport" id="viewport">
            <canvas id="bikeCanvas"></canvas>
            <div class="controls-hint">ドラッグ: 移動 | ホイール: 拡大縮小</div>
        </div>
    </div>

    <script>
        // --- 描画・操作用状態変数 ---
        const canvas = document.getElementById('bikeCanvas');
        const ctx = canvas.getContext('2d');
        const viewport = document.getElementById('viewport');

        let scale = 0.8; // mm -> pixel 変換用
        let panX = 0;
        let panY = 0;
        let isDragging = false;
        let startX, startY;

        // --- 入力エレメントの取得 ---
        const inputs = [
            'reach', 'stack', 'headAngle', 'seatAngle', 'seatTube', 'ett',
            'rearCenter', 'frontCenter', 'bbDrop', 'forkOffset', 'wheelbase', 'headTube',
            'stemLength', 'stemAngle', 'stemStack', 'spacerHeight',
            'handleReach', 'handleDrop', 'saddleHeight', 'saddleSetback'
        ].reduce((acc, id) => {
            acc[id] = document.getElementById(id);
            return acc;
        }, {});

        // キャンバスのリサイズ設定
        function resizeCanvas() {
            canvas.width = viewport.clientWidth;
            canvas.height = viewport.clientHeight;
            if (panX === 0 && panY === 0) {
                // 初期表示を中心に設定
                panX = canvas.width / 2 - 100;
                panY = canvas.height / 2 + 150;
            }
            draw();
        }

        window.addEventListener('resize', resizeCanvas);

        // --- 入力値の変更イベント検知 ---
        Object.values(inputs).forEach(input => {
            input.addEventListener('input', draw);
        });

        // --- マウスによるパン＆ズーム ---
        viewport.addEventListener('mousedown', (e) => {
            isDragging = true;
            startX = e.clientX - panX;
            startY = e.clientY - panY;
        });

        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            panX = e.clientX - startX;
            panY = e.clientY - startY;
            draw();
        });

        window.addEventListener('mouseup', () => isDragging = false);

        viewport.addEventListener('wheel', (e) => {
            e.preventDefault();
            const zoomFactor = 1.05;
            if (e.deltaY < 0) {
                scale *= zoomFactor;
            } else {
                scale /= zoomFactor;
            }
            draw();
        }, { passive: false });

        // --- 度→ラジアン変換 ---
        const degToRad = deg => (deg * Math.PI) / 180;

        // --- メイン描画＆計算関数 ---
        function draw() {
            // 入力データの数値化 (mm, deg)
            const val = id => parseFloat(inputs[id].value) || 0;

            const reach = val('reach');
            const stack = val('stack');
            const headAngle = val('headAngle');
            const seatAngle = val('seatAngle');
            const seatTube = val('seatTube');
            const ett = val('ett');
            const rearCenter = val('rearCenter');
            const frontCenter = val('frontCenter');
            const bbDrop = val('bbDrop');
            const forkOffset = val('forkOffset');
            const wheelbase = val('wheelbase');
            const headTube = val('headTube');

            const stemLength = val('stemLength');
            const stemAngle = val('stemAngle');
            const stemStack = val('stemStack');
            const spacerHeight = val('spacerHeight');
            const handleReach = val('handleReach');
            const handleDrop = val('handleDrop');
            const saddleHeight = val('saddleHeight');
            const saddleSetback = val('saddleSetback');

            // --- 幾何学計算 (BBセンターを原点 (0,0) とする) ---
            // 座標系: X右方向がプラス(前方), Y上方向がプラス

            // 1. ヘッドチューブ上部センター(スタック・リーチ点)
            const htTopCenter = { x: reach, y: stack };

            // 2. ステムクランプセンター計算
            // コラム軸角度: ヘッドアングルに直交する方向（垂直から90-headAngle傾く）
            const steererAngleRad = degToRad(90 - headAngle);
            // コラム上の移動距離 = スペーサー高 + ステムスタック高の半分
            const steererDist = spacerHeight + (stemStack / 2);
            const steererPoint = {
                x: htTopCenter.x - steererDist * Math.sin(steererAngleRad),
                y: htTopCenter.y + steererDist * Math.cos(steererAngleRad)
            };

            // ステム角度: コラムに垂直な面に対する角度
            // ステム有効角度(水平基準) = (90 - headAngle) + stemAngle
            const totalStemAngleRad = degToRad((90 - headAngle) + stemAngle);
            const clampCenter = {
                x: steererPoint.x + stemLength * Math.cos(totalStemAngleRad),
                y: steererPoint.y + stemLength * Math.sin(totalStemAngleRad)
            };

            // 3. ハンドルトップ / ドロップ計算
            const barTop = {
                x: clampCenter.x,
                y: clampCenter.y + 15 // ハンドルバー上部の厚み(目安15mm)
            };

            // 4. サドルトップ位置計算 (サドル高とセットバック基準)
            // シートアングル傾斜直線上の点ではなく、一般的なフィッティング表記のBBから直接計算
            const saddleTop = {
                x: -saddleSetback,
                y: Math.sqrt(Math.max(0, Math.pow(saddleHeight, 2) - Math.pow(saddleSetback, 2)))
            };

            // --- 必須計算項目の出力 ---
            // 項目1: サドルトップからステムハンドルクランプ部までの距離 (直線距離)
            const saddleToClamp = Math.sqrt(
                Math.pow(clampCenter.x - saddleTop.x, 2) + 
                Math.pow(clampCenter.y - saddleTop.y, 2)
            );
            
            // 項目2: BBセンターからハンドルトップまでの高さ (Y座標)
            const bbToHandleTop = barTop.y;

            document.getElementById('res-saddle-to-clamp').innerText = `${saddleToClamp.toFixed(1)} mm`;
            document.getElementById('res-bb-to-handletop').innerText = `${bbToHandleTop.toFixed(1)} mm`;

            // --- 描画処理 ---
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 座標変換用のヘルパー (実座標 mm -> キャンバスピクセル座標)
            const toPx = (pt) => ({
                x: panX + pt.x * scale,
                y: panY - pt.y * scale // CanvasはY下向きが正
            });

            // 背景グリッド描画
            ctx.strokeStyle = '#1e293b';
            ctx.lineWidth = 1;
            const gridSize = 100 * scale; // 100mm格子
            for (let x = panX % gridSize; x < canvas.width; x += gridSize) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
            }
            for (let y = panY % gridSize; y < canvas.height; y += gridSize) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
            }

            // 地平線 (BB基準 drop描画のため)
            const bbPx = toPx({x: 0, y: 0});

            // 各主要フレームポイントの算出
            const rearAxle = { x: -rearCenter, y: -bbDrop };
            const frontAxle = { x: frontCenter, y: -bbDrop };
            
            // ヘッドチューブ下部
            const htAngleRad = degToRad(headAngle);
            const htVector = { x: Math.cos(htAngleRad), y: Math.sin(htAngleRad) };
            const htBottomCenter = {
                x: htTopCenter.x - headTube * htVector.x,
                y: htTopCenter.y - headTube * htVector.y
            };

            // シートチューブ上部 (シートクランプ付近)
            const stAngleRad = degToRad(seatAngle);
            const seatTubeTop = {
                x: -seatTube * Math.cos(stAngleRad),
                y: seatTube * Math.sin(stAngleRad)
            };

            // --- Canvas描画ユーティリティ ---
            const drawLine = (pt1, pt2, color, width = 2, dash = []) => {
                const p1 = toPx(pt1), p2 = toPx(pt2);
                ctx.save();
                ctx.beginPath();
                ctx.setLineDash(dash);
                ctx.moveTo(p1.x, p1.y);
                ctx.lineTo(p2.x, p2.y);
                ctx.strokeStyle = color;
                ctx.lineWidth = width;
                ctx.stroke();
                ctx.restore();
            };

            const drawCircle = (pt, radius, color, isFill = false) => {
                const p = toPx(pt);
                ctx.beginPath();
                ctx.arc(p.x, p.y, radius * scale, 0, Math.PI * 2);
                if (isFill) {
                    ctx.fillStyle = color;
                    ctx.fill();
                } else {
                    ctx.strokeStyle = color;
                    ctx.lineWidth = 2;
                    ctx.stroke();
                }
            };

            // 1. ホイール (700c目安: 半径 340mm)
            const wheelRadius = 340;
            drawCircle(rearAxle, wheelRadius, '#334155');
            drawCircle(frontAxle, wheelRadius, '#334155');

            // 2. フレーム幾何（線図）
            // リアトライアングル
            drawLine({x:0, y:0}, rearAxle, '#f43f5e', 3); // チェーンステー
            drawLine(rearAxle, seatTubeTop, '#f43f5e', 2); // シートステー
            drawLine({x:0, y:0}, seatTubeTop, '#f43f5e', 3); // シートチューブ

            // フロントトライアングル
            drawLine({x:0, y:0}, htBottomCenter, '#f43f5e', 3); // ダウンチューブ
            drawLine(seatTubeTop, htTopCenter, '#f43f5e', 3); // トップチューブ
            drawLine(htBottomCenter, htTopCenter, '#f43f5e', 4); // ヘッドチューブ

            // フォーク
            drawLine(htBottomCenter, frontAxle, '#f43f5e', 2.5);

            // 3. ポジション構成パーツ（緑色系）
            // シートポスト & サドル
            drawLine(seatTubeTop, saddleTop, '#10b981', 3);
            // サドル形状簡易描画
            const saddleLeft = { x: saddleTop.x - 130, y: saddleTop.y };
            const saddleRight = { x: saddleTop.x + 140, y: saddleTop.y };
            drawLine(saddleLeft, saddleRight, '#10b981', 5);

            // コラム & スペーサー & ステム
            drawLine(htTopCenter, steererPoint, '#10b981', 4); // スペーサー部
            drawLine(steererPoint, clampCenter, '#10b981', 5); // ステム

            // ドロップハンドル (簡易描画)
            const handleHood = { x: clampCenter.x + handleReach, y: clampCenter.y };
            const handleDropPt = { x: clampCenter.x + handleReach - 20, y: clampCenter.y - handleDrop };
            drawLine(clampCenter, handleHood, '#10b981', 3);
            drawLine(handleHood, handleDropPt, '#10b981', 2);

            // 4. 計算用の補助線 (点線 & ガイド)
            // サドルトップ 〜 ステムクランプ部 (算出項目1)
            drawLine(saddleTop, clampCenter, '#38bdf8', 1.5, [4, 4]);

            // BB 〜 ハンドルトップ 高さガイド (算出項目2)
            drawLine({x: 0, y: 0}, {x: barTop.x, y: 0}, '#64748b', 1, [2, 2]);
            drawLine({x: barTop.x, y: 0}, barTop, '#38bdf8', 1.5, [4, 4]);

            // 5. 支点・重要ポイントマーク
            drawCircle({x:0, y:0}, 8, '#f8fafc', true); // BB
            drawCircle(clampCenter, 5, '#38bdf8', true); // クランプ部
            drawCircle(saddleTop, 5, '#10b981', true); // サドルトップ基準点
        }

        // 初期描画実行
        resizeCanvas();
    </script>
</body>
</html>
