<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>バイクジオメトリ＆ポジション シミュレーター (重ね合わせ比較対応)</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: #1e293b;
            --accent-color: #38bdf8;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --border-color: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            touch-action: manipulation;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        header {
            background-color: var(--panel-bg);
            padding: 10px 16px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 1.05rem;
            font-weight: 600;
            color: var(--accent-color);
        }

        .main-container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        .sidebar {
            width: 420px;
            background-color: var(--panel-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            z-index: 10;
        }

        /* 比較タブ・コントロール */
        .bike-tabs-bar {
            padding: 10px 12px;
            background-color: rgba(15, 23, 42, 0.4);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .tabs-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
            color: var(--text-sub);
            font-weight: bold;
        }

        .btn-add {
            background: #0284c7;
            color: #fff;
            border: none;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 0.75rem;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-add:hover { background: #0369a1; }

        .bike-tabs-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            max-height: 120px;
            overflow-y: auto;
        }

        .tab-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
        }

        .tab-item.active {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 1px var(--accent-color);
        }

        .tab-left {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
            overflow: hidden;
        }

        .tab-left input[type="checkbox"] { cursor: pointer; }

        .tab-color-picker {
            width: 16px;
            height: 16px;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            background: none;
        }

        .tab-name {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
        }

        .tab-actions {
            display: flex;
            gap: 4px;
        }

        .btn-tab-action {
            background: transparent;
            border: none;
            color: var(--text-sub);
            cursor: pointer;
            padding: 2px 4px;
            font-size: 0.75rem;
            border-radius: 3px;
        }
        .btn-tab-action:hover { color: var(--text-main); background: rgba(255,255,255,0.1); }

        /* 計算結果エリア (格納・展開可能) */
        .calc-results {
            background-color: rgba(56, 189, 248, 0.03);
            border-bottom: 1px solid var(--border-color);
        }

        .calc-toggle-btn {
            width: 100%;
            padding: 8px 12px;
            background: rgba(30, 41, 59, 0.6);
            border: none;
            color: var(--accent-color);
            font-size: 0.8rem;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
        }

        .calc-toggle-btn:hover { background: rgba(30, 41, 59, 0.9); }

        .calc-content {
            padding: 8px 12px;
            max-height: 160px;
            overflow-y: auto;
            display: block;
        }

        .calc-results.collapsed .calc-content {
            display: none;
        }

        .result-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.7rem;
        }

        .result-table th, .result-table td {
            padding: 4px 4px;
            text-align: left;
            border-bottom: 1px solid rgba(51, 65, 85, 0.5);
            white-space: nowrap;
        }

        .result-table th {
            color: var(--text-sub);
            font-weight: 600;
        }

        .result-val {
            font-weight: bold;
            color: var(--accent-color);
        }

        /* パラメータ入力フォーム */
        .inputs-container {
            flex: 1;
            overflow-y: auto;
            padding: 12px 16px;
            -webkit-overflow-scrolling: touch;
        }

        .section-title {
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin: 12px 0 8px 0;
            padding-bottom: 4px;
            border-bottom: 2px solid var(--border-color);
            color: var(--accent-color);
        }
        .section-title:first-child { margin-top: 0; }

        .input-group {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .input-group label {
            font-size: 0.8rem;
            color: var(--text-main);
        }

        .input-wrapper {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .input-group input {
            width: 75px;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 4px 6px;
            border-radius: 4px;
            font-size: 0.85rem;
            text-align: right;
        }

        .input-group input:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        .input-group span.unit {
            font-size: 0.7rem;
            color: var(--text-sub);
            width: 20px;
        }

        /* 描画エリア */
        .viewport {
            flex: 1;
            position: relative;
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            touch-action: none;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .controls-hint {
            position: absolute;
            bottom: 12px;
            right: 12px;
            background: rgba(30, 41, 59, 0.85);
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 0.75rem;
            color: var(--text-sub);
            pointer-events: none;
            border: 1px solid var(--border-color);
        }

        @media (max-width: 768px) {
            .main-container { flex-direction: column-reverse; }
            .sidebar { width: 100%; height: 55%; }
            .viewport { height: 45%; }
        }
    </style>
</head>
<body>

    <header>
        <h1>バイクジオメトリ＆ポジション シミュレーター</h1>
    </header>

    <div class="main-container">
        <!-- サイドバー -->
        <div class="sidebar">
            <!-- バイク重ね合わせ管理タブ -->
            <div class="bike-tabs-bar">
                <div class="tabs-header">
                    <span>重ね合わせ比較リスト (BB基準)</span>
                    <button class="btn-add" id="btnAddBike">+ バイク追加</button>
                </div>
                <div class="bike-tabs-list" id="bikeTabsList"></div>
            </div>

            <!-- 計算結果比較エリア (折りたたみ可能) -->
            <div class="calc-results" id="calcResults">
                <button class="calc-toggle-btn" id="btnToggleCalc">
                    <span>▼ 算出結果比較</span>
                    <span id="toggleIcon">▲</span>
                </button>
                <div class="calc-content">
                    <table class="result-table">
                        <thead>
                            <tr>
                                <th>バイク名</th>
                                <th>サドル〜ハンドル長</th>
                                <th>サドル〜先端落差</th>
                                <th>ハンドル角度</th>
                                <th>BB〜ハンドルトップ高</th>
                            </tr>
                        </thead>
                        <tbody id="resultTableBody"></tbody>
                    </table>
                </div>
            </div>

            <!-- パラメータ入力フォーム -->
            <div class="inputs-container">
                <div class="section-title">バイクジオメトリ</div>
                <div class="input-group"><label for="reach">リーチ</label><div class="input-wrapper"><input type="number" id="reach"><span class="unit">mm</span></div></div>
                <div class="input-group"><label for="stack">スタック</label><div class="input-wrapper"><input type="number" id="stack"><span class="unit">mm</span></div></div>
                <div class="input-group"><label for="headAngle">ヘッドアングル</label><div class="input-wrapper"><input type="number" id="headAngle" step="0.1"><span class="unit">°</span></div></div>
                <div class="input-group"><label for="seatAngle">シートアングル</label><div class="input-wrapper"><input type="number" id="seatAngle" step="0.1"><span class="unit">°</span></div></div>
                <div class="input-group"><label for="seatTube">シートチューブ長</label><div class="input-wrapper"><input type="number" id="seatTube"><span class="unit">mm</span></div></div>
                <div class="input-group"><label for="rearCenter">リアセンター長</label><div class="input-wrapper"><input type="number" id="rearCenter"><span class="unit">mm</span></div></div>
                <div class="input-group"><label for="frontCenter">フロントセンター長</label><div class="input-wrapper"><input type="number" id="frontCenter"><span class="unit">mm</span></div></div>
                <div class="input-group"><label for="bbDrop">BB下がり</label><div class="input-wrapper"><input type="number" id="bbDrop"><span class="unit">mm</span></div></div>
                <div class="input-group"><label for="wheelbase">ホイールベース</label><div class="input-wrapper"><input type="number" id="wheelbase"><span class="unit">mm</span></div></div>
                <div class="input-group"><label for="headTube">ヘッドチューブ長</label><div class="input-wrapper"><input type="number" id="headTube"><span class="unit">mm</span></div></div>

                <div class="section-title">ポジション設定</div>
                <div class="input-group"><label for="stemLength">ステム長</label><div class="input-wrapper"><input type="number" id="stemLength"><span class="unit">mm</span></div></div>
                <div class="input-group"><label for="stemAngle">ステムアングル (0°=垂直, -=下, +=上)</label><div class="input-wrapper"><input type="number" id="stemAngle" step="0.1"><span class="unit">°</span></div></div>
                <div class="input-group"><label for="handleBarAngle">ハンドル角度 (0°=水平, +=上向き)</label><div class="input-wrapper"><input type="number" id="handleBarAngle" step="0.1"><span class="unit">°</span></div></div>
                <div class="input-group"><label for="stemStack">ステムスタックハイト</label><div class="input-wrapper"><input type="number" id="stemStack"><span class="unit">mm</span></div></div>
                <div class="input-group"><label for="spacerHeight">ステムスペーサー高さ</label><div class="input-wrapper"><input type="number" id="spacerHeight"><span class="unit">mm</span></div></div>
                <div class="input-group"><label for="handleReach">ハンドルリーチ</label><div class="input-wrapper"><input type="number" id="handleReach"><span class="unit">mm</span></div></div>
                <div class="input-group"><label for="handleDrop">ハンドルドロップ</label><div class="input-wrapper"><input type="number" id="handleDrop"><span class="unit">mm</span></div></div>
                <div class="input-group"><label for="saddleHeight">サドル高 (BB〜サドルトップ直線長)</label><div class="input-wrapper"><input type="number" id="saddleHeight"><span class="unit">mm</span></div></div>
            </div>
        </div>

        <!-- メインキャンバス表示エリア -->
        <div class="viewport" id="viewport">
            <canvas id="bikeCanvas"></canvas>
            <div class="controls-hint">ドラッグ/スワイプ: 移動 | ピンチ/ホイール: 拡大縮小</div>
        </div>
    </div>

    <script>
        const PRESET_COLORS = ['#f43f5e', '#38bdf8', '#10b981', '#fbbf24', '#a855f7', '#ec4899'];

        const createDefaultBike = (id, name, color) => ({
            id: id,
            name: name,
            color: color,
            visible: true,
            data: {
                reach: 385, stack: 540, headAngle: 73, seatAngle: 74, seatTube: 500,
                rearCenter: 410, frontCenter: 580, bbDrop: 70,
                wheelbase: 980, headTube: 130, stemLength: 100, stemAngle: -6, handleBarAngle: 0,
                stemStack: 40, spacerHeight: 15, handleReach: 80, handleDrop: 125, saddleHeight: 700
            }
        });

        let bikes = [
            createDefaultBike('1', 'バイク 1', PRESET_COLORS[0]),
            createDefaultBike('2', 'バイク 2', PRESET_COLORS[1])
        ];
        bikes[1].data.reach = 395;
        bikes[1].data.stack = 550;
        bikes[1].data.stemLength = 110;

        let activeBikeId = '1';

        const canvas = document.getElementById('bikeCanvas');
        const ctx = canvas.getContext('2d');
        const viewport = document.getElementById('viewport');

        let scale = 0.8;
        let panX = 0;
        let panY = 0;
        let isDragging = false;
        let startX, startY;
        let initialPinchDistance = null;

        const inputIds = [
            'reach', 'stack', 'headAngle', 'seatAngle', 'seatTube',
            'rearCenter', 'frontCenter', 'bbDrop', 'wheelbase', 'headTube',
            'stemLength', 'stemAngle', 'handleBarAngle', 'stemStack', 'spacerHeight',
            'handleReach', 'handleDrop', 'saddleHeight'
        ];

        const inputs = inputIds.reduce((acc, id) => {
            acc[id] = document.getElementById(id);
            return acc;
        }, {});

        // 結果折りたたみボタン制御
        const calcResults = document.getElementById('calcResults');
        const btnToggleCalc = document.getElementById('btnToggleCalc');
        const toggleIcon = document.getElementById('toggleIcon');
        
        btnToggleCalc.addEventListener('click', () => {
            calcResults.classList.toggle('collapsed');
            toggleIcon.textContent = calcResults.classList.contains('collapsed') ? '▼' : '▲';
        });

        function getActiveBike() {
            return bikes.find(b => b.id === activeBikeId) || bikes[0];
        }

        function loadInputsFromActiveBike() {
            const bike = getActiveBike();
            if (!bike) return;
            inputIds.forEach(id => {
                if (inputs[id]) inputs[id].value = bike.data[id];
            });
        }

        function updateActiveBikeFromInputs() {
            const bike = getActiveBike();
            if (!bike) return;
            inputIds.forEach(id => {
                if (inputs[id]) bike.data[id] = parseFloat(inputs[id].value) || 0;
            });
            renderTabs();
            draw();
        }

        inputIds.forEach(id => {
            inputs[id].addEventListener('input', updateActiveBikeFromInputs);
        });

        function renderTabs() {
            const container = document.getElementById('bikeTabsList');
            container.innerHTML = '';

            bikes.forEach(bike => {
                const isActive = bike.id === activeBikeId;
                const tab = document.createElement('div');
                tab.className = `tab-item ${isActive ? 'active' : ''}`;
                
                tab.innerHTML = `
                    <div class="tab-left">
                        <input type="checkbox" ${bike.visible ? 'checked' : ''} class="chk-visible" title="重ね合わせ表示/非表示">
                        <input type="color" value="${bike.color}" class="tab-color-picker" title="表示色の変更">
                        <span class="tab-name">${bike.name}</span>
                    </div>
                    <div class="tab-actions">
                        <button class="btn-tab-action btn-clone" title="複製">📋</button>
                        ${bikes.length > 1 ? `<button class="btn-tab-action btn-del" title="削除">✕</button>` : ''}
                    </div>
                `;

                tab.addEventListener('click', (e) => {
                    if (e.target.tagName === 'INPUT' || e.target.classList.contains('btn-tab-action')) return;
                    activeBikeId = bike.id;
                    loadInputsFromActiveBike();
                    renderTabs();
                    draw();
                });

                tab.querySelector('.chk-visible').addEventListener('change', (e) => {
                    bike.visible = e.target.checked;
                    draw();
                });

                tab.querySelector('.tab-color-picker').addEventListener('input', (e) => {
                    bike.color = e.target.value;
                    renderTabs();
                    draw();
                });

                tab.querySelector('.btn-clone').addEventListener('click', (e) => {
                    e.stopPropagation();
                    const newId = String(Date.now());
                    const newColor = PRESET_COLORS[bikes.length % PRESET_COLORS.length];
                    const newBike = {
                        id: newId,
                        name: `${bike.name} (コピー)`,
                        color: newColor,
                        visible: true,
                        data: JSON.parse(JSON.stringify(bike.data))
                    };
                    bikes.push(newBike);
                    activeBikeId = newId;
                    loadInputsFromActiveBike();
                    renderTabs();
                    draw();
                });

                const btnDel = tab.querySelector('.btn-del');
                if (btnDel) {
                    btnDel.addEventListener('click', (e) => {
                        e.stopPropagation();
                        bikes = bikes.filter(b => b.id !== bike.id);
                        if (activeBikeId === bike.id) {
                            activeBikeId = bikes[0].id;
                        }
                        loadInputsFromActiveBike();
                        renderTabs();
                        draw();
                    });
                }

                container.appendChild(tab);
            });
        }

        document.getElementById('btnAddBike').addEventListener('click', () => {
            const newId = String(Date.now());
            const newColor = PRESET_COLORS[bikes.length % PRESET_COLORS.length];
            const newBike = createDefaultBike(newId, `バイク ${bikes.length + 1}`, newColor);
            bikes.push(newBike);
            activeBikeId = newId;
            loadInputsFromActiveBike();
            renderTabs();
            draw();
        });

        function resizeCanvas() {
            canvas.width = viewport.clientWidth;
            canvas.height = viewport.clientHeight;
            if (panX === 0 && panY === 0) {
                panX = canvas.width / 2 - 100;
                panY = canvas.height / 2 + 150;
            }
            draw();
        }

        window.addEventListener('resize', resizeCanvas);

        viewport.addEventListener('mousedown', (e) => {
            isDragging = true;
            startX = e.clientX - panX;
            startY = e.clientY - panY;
        });

        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            panX = e.clientX - startX;
            panY = e.clientY - startY;
            draw();
        });

        window.addEventListener('mouseup', () => isDragging = false);

        viewport.addEventListener('wheel', (e) => {
            e.preventDefault();
            const zoomFactor = 1.05;
            if (e.deltaY < 0) scale *= zoomFactor;
            else scale /= zoomFactor;
            draw();
        }, { passive: false });

        function getTouchDistance(touches) {
            return Math.hypot(touches[0].clientX - touches[1].clientX, touches[0].clientY - touches[1].clientY);
        }

        viewport.addEventListener('touchstart', (e) => {
            if (e.touches.length === 1) {
                isDragging = true;
                startX = e.touches[0].clientX - panX;
                startY = e.touches[0].clientY - panY;
            } else if (e.touches.length === 2) {
                isDragging = false;
                initialPinchDistance = getTouchDistance(e.touches);
            }
        }, { passive: true });

        viewport.addEventListener('touchmove', (e) => {
            if (e.touches.length === 1 && isDragging) {
                panX = e.touches[0].clientX - startX;
                panY = e.touches[0].clientY - startY;
                draw();
            } else if (e.touches.length === 2 && initialPinchDistance) {
                const currentDistance = getTouchDistance(e.touches);
                scale *= (currentDistance / initialPinchDistance);
                initialPinchDistance = currentDistance;
                draw();
            }
        }, { passive: true });

        viewport.addEventListener('touchend', (e) => {
            if (e.touches.length < 2) initialPinchDistance = null;
            if (e.touches.length === 0) isDragging = false;
        });

        const degToRad = deg => (deg * Math.PI) / 180;

        function calculateBikeGeometry(bData) {
            const stRad = degToRad(bData.seatAngle);
            const htRad = degToRad(bData.headAngle);

            const saddleTop = {
                x: -bData.saddleHeight * Math.cos(stRad),
                y: bData.saddleHeight * Math.sin(stRad)
            };

            const htTopCenter = { x: bData.reach, y: bData.stack };

            const steererDist = bData.spacerHeight + (bData.stemStack / 2);
            const steererPoint = {
                x: htTopCenter.x - steererDist * Math.cos(htRad),
                y: htTopCenter.y + steererDist * Math.sin(htRad)
            };

            const stemTotalAngleRad = degToRad(90 - bData.headAngle + bData.stemAngle);
            
            const clampCenter = {
                x: steererPoint.x + bData.stemLength * Math.cos(stemTotalAngleRad),
                y: steererPoint.y + bData.stemLength * Math.sin(stemTotalAngleRad)
            };

            const barTop = {
                x: clampCenter.x,
                y: clampCenter.y + 15
            };

            // 修正箇所：ハンドル角度(rad)による先端座標の計算
            const barAngleRad = degToRad(bData.handleBarAngle || 0);
            const handleTip = {
                x: clampCenter.x + bData.handleReach * Math.cos(barAngleRad),
                y: clampCenter.y + bData.handleReach * Math.sin(barAngleRad)
            };

            const htBottomCenter = {
                x: htTopCenter.x + bData.headTube * Math.cos(htRad),
                y: htTopCenter.y - bData.headTube * Math.sin(htRad)
            };

            const seatTubeTop = {
                x: -bData.seatTube * Math.cos(stRad),
                y: bData.seatTube * Math.sin(stRad)
            };

            const rearAxle = { x: -bData.rearCenter, y: -bData.bbDrop };
            const frontAxle = { x: bData.frontCenter, y: -bData.bbDrop };

            // 指標計算の補正
            const saddleToHandle = Math.sqrt(
                Math.pow(clampCenter.x - saddleTop.x, 2) + 
                Math.pow(clampCenter.y - saddleTop.y, 2)
            );
            
            // 修正箇所：サドルトップ(Y) - ハンドル先端(Y) の垂直落差
            const saddleToTipDrop = saddleTop.y - handleTip.y;
            const bbToHandleTop = barTop.y;
            const handleAngleVal = bData.handleBarAngle || 0;

            return {
                saddleTop, htTopCenter, steererPoint, clampCenter, barTop, handleTip,
                htBottomCenter, seatTubeTop, rearAxle, frontAxle,
                saddleToHandle, saddleToTipDrop, bbToHandleTop, handleAngleVal
            };
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const toPx = (pt) => ({
                x: panX + pt.x * scale,
                y: panY - pt.y * scale
            });

            ctx.strokeStyle = '#1e293b';
            ctx.lineWidth = 1;
            const gridSize = 100 * scale;
            for (let x = panX % gridSize; x < canvas.width; x += gridSize) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
            }
            for (let y = panY % gridSize; y < canvas.height; y += gridSize) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
            }

            const drawLine = (pt1, pt2, color, width = 2, dash = []) => {
                const p1 = toPx(pt1), p2 = toPx(pt2);
                ctx.save();
                ctx.beginPath();
                ctx.setLineDash(dash);
                ctx.moveTo(p1.x, p1.y);
                ctx.lineTo(p2.x, p2.y);
                ctx.strokeStyle = color;
                ctx.lineWidth = width;
                ctx.stroke();
                ctx.restore();
            };

            const drawCircle = (pt, radius, color, isFill = false) => {
                const p = toPx(pt);
                ctx.beginPath();
                ctx.arc(p.x, p.y, radius * scale, 0, Math.PI * 2);
                if (isFill) {
                    ctx.fillStyle = color;
                    ctx.fill();
                } else {
                    ctx.strokeStyle = color;
                    ctx.lineWidth = 1.5;
                    ctx.stroke();
                }
            };

            const tableBody = document.getElementById('resultTableBody');
            tableBody.innerHTML = '';

            bikes.forEach(bike => {
                const geo = calculateBikeGeometry(bike.data);

                if (bike.visible) {
                    const tr = document.createElement('tr');
                    tr.style.color = bike.color;
                    tr.innerHTML = `
                        <td><strong>${bike.name}</strong></td>
                        <td class="result-val">${geo.saddleToHandle.toFixed(1)} mm</td>
                        <td class="result-val">${geo.saddleToTipDrop.toFixed(1)} mm</td>
                        <td class="result-val">${geo.handleAngleVal.toFixed(1)}°</td>
                        <td class="result-val">${geo.bbToHandleTop.toFixed(1)} mm</td>
                    `;
                    tableBody.appendChild(tr);
                }

                if (!bike.visible) return;

                const isSelected = bike.id === activeBikeId;
                const mainColor = bike.color;
                const strokeWidth = isSelected ? 3 : 1.5;
                const lineDash = isSelected ? [] : [6, 4];

                drawCircle(geo.rearAxle, 340, mainColor);
                drawCircle(geo.frontAxle, 340, mainColor);

                drawLine({x:0, y:0}, geo.rearAxle, mainColor, strokeWidth, lineDash);
                drawLine(geo.rearAxle, geo.seatTubeTop, mainColor, strokeWidth, lineDash);
                drawLine({x:0, y:0}, geo.seatTubeTop, mainColor, strokeWidth, lineDash);
                drawLine({x:0, y:0}, geo.htBottomCenter, mainColor, strokeWidth, lineDash);
                drawLine(geo.seatTubeTop, geo.htTopCenter, mainColor, strokeWidth, lineDash);
                drawLine(geo.htBottomCenter, geo.htTopCenter, mainColor, strokeWidth + 1, lineDash);
                drawLine(geo.htBottomCenter, geo.frontAxle, mainColor, strokeWidth, lineDash);

                drawLine({x:0, y:0}, geo.saddleTop, mainColor, strokeWidth, lineDash);
                const saddleLeft = { x: geo.saddleTop.x - 130, y: geo.saddleTop.y };
                const saddleRight = { x: geo.saddleTop.x + 140, y: geo.saddleTop.y };
                drawLine(saddleLeft, saddleRight, mainColor, strokeWidth + 2);

                drawLine(geo.htTopCenter, geo.steererPoint, mainColor, strokeWidth + 1);
                drawLine(geo.steererPoint, geo.clampCenter, mainColor, strokeWidth + 2);

                // 赤線（ハンドルフラット部/先端）の描画
                drawLine(geo.clampCenter, geo.handleTip, '#f43f5e', strokeWidth + 1);

                // 下ハン部
                const barAngleRad = degToRad(bike.data.handleBarAngle || 0);
                const handleDropPt = { 
                    x: geo.handleTip.x - 20 * Math.cos(barAngleRad), 
                    y: geo.handleTip.y - bike.data.handleDrop 
                };
                drawLine(geo.handleTip, handleDropPt, mainColor, strokeWidth - 0.5);

                if (isSelected) {
                    // サドル〜ハンドルクランプ直線
                    drawLine(geo.saddleTop, geo.clampCenter, '#38bdf8', 1, [3, 3]);
                    
                    // サドルトップ〜赤線先端の落差ガイドライン
                    drawLine(geo.saddleTop, {x: geo.handleTip.x, y: geo.saddleTop.y}, '#64748b', 1, [2, 2]);
                    drawLine({x: geo.handleTip.x, y: geo.saddleTop.y}, geo.handleTip, '#f43f5e', 1, [3, 3]);

                    drawCircle(geo.clampCenter, 4, '#38bdf8', true);
                    drawCircle(geo.saddleTop, 4, mainColor, true);
                    drawCircle(geo.handleTip, 4, '#f43f5e', true);
                }
            });

            drawCircle({x:0, y:0}, 7, '#f8fafc', true);
            drawCircle({x:0, y:0}, 9, '#38bdf8', false);
        }

        loadInputsFromActiveBike();
        renderTabs();
        resizeCanvas();
    </script>
</body>
</html>
